[workspace]
members = ["src-tauri", "crates/cucina-core", "crates/cucina-cli"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cucina-core = { path = "crates/cucina-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
