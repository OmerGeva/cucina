# Checks every push and pull request. macOS runners only — the app does not
# build anywhere else (see Platform support in the README).
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci

      # The app bundles the CLI as a resource, and tauri-build validates that
      # path exists — so this has to be built before anything compiles the
      # app, including a plain clippy run.
      - name: Build the CLI (bundled into the app)
        run: cargo build --release -p cucina-cli

      # tsc --noEmit && vite build
      - name: Frontend
        run: npm run build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all
