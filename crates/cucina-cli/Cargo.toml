[package]
name = "cucina-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# Named cucina-cli, not cucina: macOS filesystems are case-insensitive, so a
# binary called `cucina` and the app's `Cucina` are the same path in target/
# and would overwrite each other. It installs as `cucina`.
[[bin]]
name = "cucina-cli"
path = "src/main.rs"

[dependencies]
cucina-core.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
